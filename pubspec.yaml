name: kiu
description: Kazan Islamic University LMS companion
publish_to: none
version: 1.4.0+18

environment:
  sdk: 3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: 22.3.0
  home_widget: 0.9.4
  html: 0.15.7
  intl: 0.20.3
  shared_preferences: 2.5.5
  timezone: 0.11.1
  webview_flutter: 4.14.1
  webview_flutter_android: 4.14.1
  workmanager: 0.10.9
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: 0.14.4
  flutter_lints: 6.0.0
  webview_flutter_platform_interface: 2.15.1

flutter:
  uses-material-design: true
  generate: true
  # No `assets:` block on purpose. The logo is consumed at build time by
  # flutter_launcher_icons below and as res/drawable-*/ic_notification.png;
  # bundling kiu-logo.png as a runtime asset added 545 KB to every APK with
  # no Image.asset/rootBundle reference anywhere in lib/.

flutter_launcher_icons:
  android: true
  image_path: kiu-logo.png
  min_sdk_android: 24
